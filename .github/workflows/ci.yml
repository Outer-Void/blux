name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python -e . -r requirements-dev.txt
          # Stage 02 integration target. --no-deps keeps the editable local blux-sdk under test.
          python -m pip install --no-deps "blux-system @ git+https://github.com/Outer-Void/blux-system.git@ebdf84c8e422ae2b9a88278008e9b4b3f4fdfc3a"
      # Stage 03 integration target (DAT needs Python 3.11+). Its .blux/ comes from the same pinned commit.
      - name: Install DAT
        if: matrix.python != '3.10'
        run: python -m pip install --no-deps "outervoid-dat @ git+https://github.com/Outer-Void/dat.git@ba5838636d8576b555fcf854793a709210814a1a"
      - uses: actions/checkout@v4
        if: matrix.python != '3.10'
        with:
          repository: Outer-Void/dat
          ref: ba5838636d8576b555fcf854793a709210814a1a
          path: _dat
      # Stage 04 integration target (LRC needs Python 3.11+): its .blux/ and the pinned hard-gate fixture come
      # from the same commit.
      - name: Install LRC
        if: matrix.python != '3.10'
        run: python -m pip install --no-deps "outervoid-lrc @ git+https://github.com/Outer-Void/lrc.git@9b99551678cbc4cff1b127d287a7f9779297fe25"
      - uses: actions/checkout@v4
        if: matrix.python != '3.10'
        with:
          repository: Outer-Void/lrc
          ref: 9b99551678cbc4cff1b127d287a7f9779297fe25
          path: _lrc
      # Stage 05 integration target (GOD needs Python 3.11+; it uses the editable blux-sdk under test).
      - name: Install GOD
        if: matrix.python != '3.10'
        run: python -m pip install --no-deps "god-cli @ git+https://github.com/Outer-Void/god.git@26fa4153325948021b1e7767f1aa95304b49d52e"
      - uses: actions/checkout@v4
        if: matrix.python != '3.10'
        with:
          repository: Outer-Void/god
          ref: 26fa4153325948021b1e7767f1aa95304b49d52e
          path: _god
      # Stage 06 integration target (CogA supports Python 3.10+, so on every matrix entry).
      - name: Install CogA
        run: python -m pip install --no-deps "blux-coga @ git+https://github.com/Outer-Void/blux-coga.git@64375dcc638c63dad31c817b88cb605a6452cf6d"
      - uses: actions/checkout@v4
        with:
          repository: Outer-Void/blux-coga
          ref: 64375dcc638c63dad31c817b88cb605a6452cf6d
          path: _coga
      - name: Schema drift and lock
        run: python packaging/sync_schemas.py --check
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests (incl. BLUX System, DAT, LRC, GOD and CogA hard-gate integration)
        run: pytest
        env:
          BLUX_REQUIRE_SYSTEM: "1"
          BLUX_REQUIRE_DAT: ${{ matrix.python != '3.10' && '1' || '0' }}
          BLUX_REQUIRE_LRC: ${{ matrix.python != '3.10' && '1' || '0' }}
          BLUX_REQUIRE_GOD: ${{ matrix.python != '3.10' && '1' || '0' }}
          BLUX_REQUIRE_COGA: "1"
          DAT_PROJECT_DIR: ${{ github.workspace }}/_dat
          LRC_PROJECT_DIR: ${{ github.workspace }}/_lrc
          GOD_PROJECT_DIR: ${{ github.workspace }}/_god
          COGA_PROJECT_DIR: ${{ github.workspace }}/_coga
      - name: Wheel round trip
        run: bash packaging/verify_wheel.sh
