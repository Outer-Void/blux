name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python -e . -r requirements-dev.txt
          # Integration targets (BLUX System, DAT, LRC, GOD, CogA, cA, BluxGPT) come only from
          # integrations/targets.lock.json (OV-61). --no-deps keeps the editable local blux-sdk under test.
          python tools/integration_targets.py check
          python tools/integration_targets.py install
          python tools/integration_targets.py checkout _targets
          python tools/integration_targets.py env _targets >> "$GITHUB_ENV"
      # Stage 15: the Termux .deb is built from the pinned BluxGPT commit (packaging/termux/vendor.lock.json).
      - uses: actions/checkout@v4
        with:
          repository: Outer-Void/blux-gpt
          ref: 4609cd987508ea6dd0c27218b623b02b74dfb5d4
          path: _bluxgpt
          fetch-depth: 0
      - name: Schema drift and lock
        run: python packaging/sync_schemas.py --check
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests (incl. BLUX System, DAT, LRC, GOD, CogA, cA and Model API hard-gate integration)
        run: pytest
        env:
          BLUX_BLUXGPT_SRC: ${{ github.workspace }}/_bluxgpt
      - name: Wheel round trip
        run: bash packaging/verify_wheel.sh
