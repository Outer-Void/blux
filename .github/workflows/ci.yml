name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python -e . -r requirements-dev.txt
      - name: Schema drift and lock
        run: python packaging/sync_schemas.py --check
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest
      - name: Wheel round trip
        run: bash packaging/verify_wheel.sh
