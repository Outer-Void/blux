[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blux-sdk"
version = "0.2.0"
description = "BLUX SDK: Contract v1 and Model API v1 schemas, validation, identifiers, envelopes and errors."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-BLUX-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Outer-Void" }]
dependencies = [
  "jsonschema>=4.18,<5",
  "referencing>=0.30",
  "PyYAML>=6.0,<7",
]

[project.urls]
Repository = "https://github.com/Outer-Void/blux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blux_sdk = ["py.typed", "schemas/v1/*.schema.json", "schemas/model_api/v1/*.schema.json"]
